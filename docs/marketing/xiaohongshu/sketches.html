<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光集 · 手绘白板（1080×1080）</title>
<!--
  Hand-drawn whiteboard sketches in the style of Excalidraw (the same rough.js line library, a hand-lettered font).
  Each board is drawn stroke by stroke; every element starts when its "anchor" word is spoken, so the drawing follows
  what you say. scripts/audio/build-talking-video.py renders these and lays them over your video.

    sketches.html?board=problem|flow|story           the finished board
    ...&play=1                                        replay it in a loop (anchors spaced 1.6 s apart)
    ...&t=2.3&cues=mimo:0.2,lightroom:4.1&render=1    one frame (what the render script asks for)

  To change a drawing or a word, edit the board function below. rough.js is MIT licensed (vendor/rough.js).
-->
<script src="vendor/rough.js"></script>
<style>
html,body{margin:0;background:#fbf8ef}
body.render{overflow:hidden}
svg{display:block}
text{font-family:"Hannotate SC","HanziPen SC","PingFang SC",sans-serif}
</style>
</head>
<body>
<svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#fbf8ef"/><g id="board"></g></svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const Q = new URLSearchParams(location.search);
const svg = document.getElementById("s"), root = document.getElementById("board"), rc = rough.svg(svg);
const INK = "#1e1e1e", GREY = "#868e96", RED = "#c92a2a", GREEN = "#2b8a3e", ORANGE = "#e8590c", SOFT = "#fff3bf", MINT = "#d3f9d8";
let seed = 1; const items = [];

/* ---- drawing helpers: each returns nothing, and registers an item that starts at an anchor word ---- */
function opt(o = {}) { return { roughness: 1.5, bowing: 1.3, strokeWidth: 3.4, stroke: INK, seed: seed++, ...o }; }
function put(g, at, delay = 0, dur = 0.7, kind = "shape") { root.appendChild(g); items.push({ g, at, delay, dur, kind }); }
const rect = (x, y, w, h, at, d, o) => put(rc.rectangle(x, y, w, h, opt(o)), at, d, 0.8);
const circle = (x, y, r, at, d, o) => put(rc.circle(x, y, r * 2, opt(o)), at, d, 0.7);
const line = (x1, y1, x2, y2, at, d, o) => put(rc.line(x1, y1, x2, y2, opt(o)), at, d, 0.5);
function arrow(x1, y1, x2, y2, at, d, o = {}) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 26;
  const g = document.createElementNS(NS, "g");
  g.appendChild(rc.line(x1, y1, x2, y2, opt(o)));
  for (const s of [-0.5, 0.5]) g.appendChild(rc.line(x2, y2, x2 - h * Math.cos(a + s), y2 - h * Math.sin(a + s), opt(o)));
  put(g, at, d, 0.7);
}
function cross(x, y, r, at, d, color = RED) { const g = document.createElementNS(NS, "g");
  g.appendChild(rc.line(x - r, y - r, x + r, y + r, opt({ stroke: color, strokeWidth: 6 })));
  g.appendChild(rc.line(x + r, y - r, x - r, y + r, opt({ stroke: color, strokeWidth: 6 }))); put(g, at, d, 0.5); }
function check(x, y, s, at, d, color = GREEN) { put(rc.linearPath([[x - s, y], [x - s * 0.3, y + s * 0.7], [x + s, y - s * 0.8]], opt({ stroke: color, strokeWidth: 7 })), at, d, 0.5); }
function text(str, x, y, at, d, { size = 54, color = INK, anchor = "middle" } = {}) {
  const t = document.createElementNS(NS, "text");
  Object.entries({ x, y, "text-anchor": anchor, "font-size": size, fill: color }).forEach(([k, v]) => t.setAttribute(k, v));
  t.textContent = str; put(t, at, d, 0.5, "text");
}
function phone(x, y, w, h, at, d, fill) {
  rect(x, y, w, h, at, d, { fill, fillStyle: "solid" }); rect(x + 14, y + 22, w - 28, h - 70, at, d + 0.15, { strokeWidth: 2.4 });
  circle(x + w / 2, y + h - 24, 9, at, d + 0.3, { strokeWidth: 2.4 });
}
function laptop(x, y, w, h, at, d) {
  rect(x, y, w, h, at, d); rect(x + 14, y + 14, w - 28, h - 28, at, d + 0.15, { strokeWidth: 2.4 });
  line(x - 40, y + h + 22, x + w + 40, y + h + 22, at, d + 0.3); line(x - 40, y + h + 22, x - 10, y + h, at, d + 0.35); line(x + w + 40, y + h + 22, x + w + 10, y + h, at, d + 0.35);
}
function person(x, y, at, d) {
  circle(x, y, 40, at, d); line(x, y + 40, x, y + 200, at, d + 0.2); line(x, y + 85, x - 62, y + 140, at, d + 0.3);
  line(x, y + 85, x + 70, y + 125, at, d + 0.35); line(x, y + 200, x - 55, y + 292, at, d + 0.5); line(x, y + 200, x + 58, y + 292, at, d + 0.55);
  line(x - 16, y - 6, x - 16, y - 2, at, d + 0.6, { strokeWidth: 5 }); line(x + 16, y - 6, x + 16, y - 2, at, d + 0.6, { strokeWidth: 5 });
  put(rc.arc(x, y + 10, 34, 24, 0.25 * Math.PI, 0.75 * Math.PI, false, opt({ strokeWidth: 3 })), at, d + 0.65, 0.3);
}

/* ---- the boards. Anchors are the words that trigger them (see ANCHORS in build-talking-video.py) ---- */
const BOARDS = {
  problem() {                        // anchors: mimo, lightroom
    phone(150, 130, 200, 340, "mimo", 0, MINT);
    text("DJI Mimo", 250, 535, "mimo", 0.4, { size: 56 });
    check(420, 250, 34, "mimo", 0.9);
    text("只有手机版", 250, 600, "mimo", 1.2, { size: 50, color: ORANGE });
    laptop(640, 170, 330, 220, "mimo", 1.8);
    text("?", 805, 330, "mimo", 2.3, { size: 130, color: GREY });
    text("Mac", 805, 500, "mimo", 2.0, { size: 56 });
    arrow(380, 330, 600, 330, "mimo", 1.7, { stroke: GREY, strokeLineDash: [10, 10] });
    cross(490, 330, 26, "mimo", 2.4);
    text("Lightroom · Photoshop", 540, 715, "lightroom", 0, { size: 56 });
    const knobs = [330, 640, 460, 800];
    knobs.forEach((k, i) => { const y = 780 + i * 66;
      line(110, y, 970, y, "lightroom", 0.4 + i * 0.18, { strokeWidth: 2.6, stroke: GREY });
      circle(k, y, 15, "lightroom", 0.55 + i * 0.18, { fill: INK, fillStyle: "solid" }); });
    text("一打开，全是看不懂的滑块", 540, 1050, "lightroom", 1.5, { size: 48, color: ORANGE });
  },
  flow() {                           // anchors: name, auto, presets, crop, save
    text("光集", 400, 190, "name", 0, { size: 150 });
    circle(640, 150, 54, "name", 0.3); [0, 1, 2, 3].forEach(i => { const a = i * Math.PI / 2 + 0.5;
      line(640, 150, 640 + 54 * Math.cos(a), 150 + 54 * Math.sin(a), "name", 0.45 + i * 0.05, { strokeWidth: 2.6 }); });
    circle(640, 150, 12, "name", 0.7, { fill: ORANGE, fillStyle: "solid", stroke: ORANGE });
    line(160, 235, 700, 228, "name", 0.8, { stroke: ORANGE, strokeWidth: 5 });
    text("Mac 上，简单得像手机 App", 540, 300, "name", 1.1, { size: 46, color: GREY });
    const cell = (x, y, n, at) => { rect(x, y, 440, 300, at, 0, { strokeWidth: 3 }); text(n, x + 36, y + 56, at, 0.3, { size: 54, color: ORANGE }); };
    // 1 自动
    cell(70, 350, "①", "auto");
    [[0, -55], [38, -38], [55, 0], [38, 38], [0, 55], [-38, 38], [-55, 0], [-38, -38]].forEach(([dx, dy], i) =>
      line(290 + dx * 0.55, 470 + dy * 0.55, 290 + dx, 470 + dy, "auto", 0.4 + i * 0.04, { strokeWidth: 3.6, stroke: ORANGE }));
    circle(290, 470, 14, "auto", 0.6, { fill: ORANGE, fillStyle: "solid", stroke: ORANGE });
    text("点一下「自动」", 290, 585, "auto", 0.7, { size: 50 });
    text("不满意，⌘Z 撤销", 290, 630, "auto", 1.3, { size: 36, color: GREY });
    // 2 预设
    cell(570, 350, "②", "presets");
    [[640, 410], [760, 410], [640, 480], [760, 480]].forEach(([x, y], i) => rect(x, y, 100, 56, "presets", 0.35 + i * 0.12, { strokeWidth: 2.6, fill: i === 1 ? SOFT : undefined, fillStyle: "solid" }));
    rect(752, 402, 116, 72, "presets", 0.9, { stroke: GREEN, strokeWidth: 4 });
    text("预设，照片直接预览", 790, 590, "presets", 0.9, { size: 42 });
    // 3 裁剪
    cell(70, 690, "③", "crop");
    rect(160, 770, 250, 140, "crop", 0.3, { strokeWidth: 2.4, stroke: GREY });
    [[175, 785, 40, 0, 0, 40], [395, 785, -40, 0, 0, 40], [175, 895, 40, 0, 0, -40], [395, 895, -40, 0, 0, -40]].forEach(([x, y, a, b, c, d2], i) => {
      line(x, y, x + a, y + b, "crop", 0.6 + i * 0.1, { strokeWidth: 6 }); line(x, y, x + c, y + d2, "crop", 0.6 + i * 0.1, { strokeWidth: 6 }); });
    text("裁剪，直接在照片上拖", 290, 960, "crop", 0.9, { size: 40 });
    // 4 存进「照片」
    cell(570, 690, "④", "save");
    rect(630, 760, 150, 120, "save", 0.3, { strokeWidth: 2.8, fill: SOFT, fillStyle: "solid" });
    line(645, 865, 690, 810, "save", 0.6, { strokeWidth: 3 }); line(690, 810, 725, 850, "save", 0.65, { strokeWidth: 3 }); line(725, 850, 765, 800, "save", 0.7, { strokeWidth: 3 });
    arrow(800, 820, 880, 820, "save", 0.9);
    rect(900, 750, 66, 130, "save", 1.1, { strokeWidth: 3, fill: MINT, fillStyle: "solid" });
    text("存进「照片」", 790, 960, "save", 1.2, { size: 44 });
  },
  story() {                          // anchors: chatgpt, claude, human, blue, boxes
    rect(80, 110, 390, 160, "chatgpt", 0);
    text("ChatGPT", 275, 175, "chatgpt", 0.3, { size: 58 });
    text("最早的原型", 275, 240, "chatgpt", 0.7, { size: 42, color: GREY });
    rect(610, 110, 390, 160, "claude", 0);
    text("Claude Code", 805, 175, "claude", 0.3, { size: 58 });
    text("一点点改", 805, 240, "claude", 0.7, { size: 42, color: GREY });
    arrow(485, 190, 595, 190, "claude", 0);
    arrow(805, 285, 790, 505, "claude", 1.0, { stroke: ORANGE });
    rect(560, 520, 440, 170, "claude", 1.5, { fill: SOFT, fillStyle: "solid" });
    text("光集", 780, 630, "claude", 1.9, { size: 84 });
    person(170, 520, "human", 0);
    text("我说一句人话", 470, 430, "human", 0.7, { size: 48, color: ORANGE });
    arrow(262, 530, 600, 295, "human", 1.0, { stroke: ORANGE });
    rect(290, 740, 430, 100, "blue", 0, { strokeWidth: 3 });
    text("这个蓝色太亮了", 505, 808, "blue", 0.4, { size: 50 });
    rect(290, 870, 430, 100, "boxes", 0, { strokeWidth: 3 });
    text("方框太多了", 505, 938, "boxes", 0.4, { size: 50 });
    text("一轮一轮，就是现在的样子", 540, 1050, "boxes", 1.4, { size: 46, color: GREY });
  }
};

/* ---- time: draw each item as its anchor word is reached ---- */
const clamp = (x) => Math.min(1, Math.max(0, x)), ease = (x) => x * x * (3 - 2 * x);
function apply(it, t, cues) {
  const start = (cues[it.at] ?? 0) + it.delay, p = clamp((t - start) / it.dur);
  if (it.kind === "text") { it.g.style.opacity = ease(p); it.g.setAttribute("transform", `translate(0 ${(1 - ease(p)) * 8})`); return; }
  for (const path of it.g.querySelectorAll("path")) {
    const fill = path.getAttribute("fill");
    if (fill && fill !== "none") { path.style.opacity = ease(p); continue; }
    path.setAttribute("pathLength", "1");
    const dashed = path.getAttribute("stroke-dasharray");
    if (dashed) { path.style.opacity = ease(p); continue; }          // dashed lines fade in instead of drawing
    path.style.strokeDasharray = "1 1"; path.style.strokeDashoffset = 1 - ease(p); path.style.opacity = p > 0 ? 1 : 0;
  }
}
function seek(t, cues) { items.forEach(it => apply(it, t, cues)); }

const name = Q.get("board") || "problem";
BOARDS[name]();
const anchors = [...new Set(items.map(i => i.at))];
const cues = {};
(Q.get("cues") || "").split(",").filter(Boolean).forEach(c => { const [k, v] = c.split(":"); cues[k] = parseFloat(v); });
anchors.forEach((a, i) => { if (!(a in cues)) cues[a] = i * 1.6; });         // missing anchors are spaced out so a board is never half empty
const last = Math.max(...anchors.map(a => cues[a])) + 4;
window.BOARD = { name, anchors, cues };
if (Q.has("render")) document.body.classList.add("render");
if (Q.has("play") && !Q.has("render")) {
  let t0 = null; const loop = (ts) => { t0 = t0 ?? ts; seek(((ts - t0) / 1000) % (last + 1), cues); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
} else seek(Q.has("t") ? parseFloat(Q.get("t")) : 99, cues);
</script>
</body>
</html>
