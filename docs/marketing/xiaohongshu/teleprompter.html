<!--
  Open this in Chrome, put the window at the top of your screen right under the camera (or on a tablet next to the lens),
  and read it as if you were telling a friend. Don't memorise it: say it in your own words, redo any sentence you like.

    Space  start / pause (3-2-1 first)      ↑ ↓  faster / slower      + −  text size
    M      mirror (for a real teleprompter glass)      R  back to the start      H  hide / show the help

  Edit the words in LINES below. A line in 【】 is a slot for something only you can say.
-->
<style>
:root{--text:#f2f0e8;--dim:#5d5b54;--bg:#0b0b0c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}

.line.now{color:var(--text)}
.line.slot{font-weight:500;font-style:italic}
body.mirror #text{transform:translateX(-50%) scaleX(-1)}
/* where your eyes should rest: a thin marker on the left edge, a third of the way down */
#eye{position:absolute;left:0;top:30%;width:34px;height:3px;background:#f2f0e8;opacity:.6}

</style>

<script>
const LINES = [
  "你用 DJI 拍完素材，想在 Mac 上调色，",

// Long story versions (docs/marketing/script-long.md): ?v=long-zh or ?v=long-en. Default: the short script above,

const LONG = {"long-zh": ["我拍了一段很喜欢的素材。", "回到家，想在 Mac 的大屏幕上，把颜色调一调。", "然后我发现了一件很奇怪的事。", "DJI 的调色 App，Mimo，只有手机版。", "想在大屏幕上调，就得把素材传回手机，在一块小小的屏幕上，一点一点地抠。", "那就用专业软件吧。", "Lightroom、Photoshop 当然什么都能做，", "可是第一次打开，迎面就是几十个滑块。", "曝光、高光、阴影、白色、黑色、去朦胧……", "我不知道先动哪一个，也不知道动完，到底是变好了还是变坏了。", "【这里说一句你当时的真实感受，比如：那一刻我只想把照片调好看，并不想先上一门课。】", "所以我想：能不能有一个工具，", "在 Mac 上，简单得像手机 App；", "想学的时候，又有人在旁边，把道理讲给你听？", "最早的一版原型，是 ChatGPT 帮我写的。它能跑，但又慢、又乱。", "后来我把它交给 Claude Code，第一件事不是加功能，而是挑毛病，而且每个毛病都在我的 Mac 上实测：", "一个有两千个文件的文件夹，原来加进素材库要将近 7 秒，界面直接卡住；现在，不到一百分之一秒。", "DJI Pocket 3 官方的 LUT，原来根本导不进来，因为文件里的标题是另一种中文编码；现在，能正常用了。", "做的过程里，最让我意外的是：", "几乎每一次改动，都是从我的一句普通的话开始的。", "「这个蓝色太亮了。」", "「右边太松了，不够紧凑。」", "「信息不够。」", "「方框太多了。」", "我说一句，AI 改一版，我再看，再说。一轮一轮。", "当然，AI 也会错，而且错得很像回事。", "有一张白桌子上的拿铁，它说这张照片「整体偏亮」，建议我把曝光降一档半。", "可是白桌子，本来就应该是亮的呀。", "这种错，只有你真的去用、真的去看，才会发现。发现了，就改掉，再加上测试，保证它不会再犯。", "【这里可以说一句你对「和 AI 一起做东西」的体会，比如：它很快，但哪里好看、哪里不对，还是得我来拍板。】", "那它现在能做什么呢？我直接给你看。", "导入一个文件夹，或者直接把照片拖进窗口。", "点一下「自动」，它会先读这张照片，再替你调好明暗和颜色。", "它很克制：白底的照片保持明亮，夜景还是夜景，日落的暖色会留下来。不满意，按一下撤销就回去了。", "想自己调，默认只有六个滑块：亮度、对比度、亮部、暗部、冷暖、鲜艳度。每一个，都有一句人话告诉你它是干什么的。", "预设，不是一排看不懂的名字，而是直接用你这张照片做成的小图，喜欢哪个，点哪个。", "裁剪，就直接在照片上拖。", "调完，直接存进 Mac 的「照片」。开着 iCloud，你的 iPhone 上马上就能看到。", "视频，还能剪成三秒以内，做成真正的实况照片。", "这几周，它又长出了不少东西。", "想只改照片的一部分？拉一道渐变，天空就暗下来，地面一点没动；也可以用椭圆、用画笔，还能让它自动找到画面里的主体。", "电线、路人、地上的垃圾，用「去除」涂一笔，它会照着周围的样子把那块补上。都在你的 Mac 上算，不用联网。", "喜欢另一张照片的颜色？用「匹配色调」，这张照片的颜色就会朝它靠过去，靠多少，你自己拖。", "一次旅行、一组作品的照片，可以放进同一个「项目」：改其中任何一张的颜色，整个项目跟着变，曝光和裁剪还是每张各管各的。", "还有两个用小型 AI 模型做的：「AI 调色」，为这一张照片单独生成一个调色；「AI HDR」，让普通照片在 HDR 屏幕上也有真正的高光。模型就装在 App 里，在你的 Mac 上运行，照片不会上传。", "Live Photo 也能直接编辑：照片和动态一起调，导出来还是 Live Photo，拍摄时间也还在。", "但我最想做好的，其实是另一件事。", "一键滤镜能让照片变好看，可是下一次，你还是不知道为什么。", "抖音上有一位摄影博主，张小样，他用动画讲直方图、讲曲线、讲光圈，比任何说明书都清楚。", "可惜，他只有几条视频，讲不完所有的基础。", "所以，我们把这种讲法，放进了 App 里。", "用你自己的照片：看它怎样碎成一个个像素，再按亮度堆成一座小山，那就是直方图。", "现在一共有十三课，从直方图、曝光、曲线，到白平衡、光圈、焦距，还有视频的帧率和 Log。", "很多课里的画面是 3D 的，可以用手拖着转：照片的亮度变成一座山，照片的颜色变成立方体里的一团点。", "文字和动画，都是我们自己写、自己画的，而且还在一课一课地往上加。", "每一课都讲些什么，我单独做成了一章，下面接着讲。", "它叫 Lucet 光集。", "Lucet 是拉丁语，意思是「它在发光」。", "光集，是把光收集起来。", "一张照片，本来就是被留住的光。", "最后说几句实在的。", "它现在还是早期版本：只能在 Apple 芯片的 Mac 上用，需要 macOS 15 以上。还没有经过苹果的公证，第一次打开，要在系统设置里手动放行一次。常见的 RAW 文件能打开，但只当普通图片处理，不会按 RAW 来冲洗。", "它不会改动你的原片，没有账号，也不会上传你的任何照片。界面有中文，也有 English。", "如果你也有一堆舍不得删、又不知道怎么调的照片，欢迎来试试。", "哪里不顺手，哪里看不懂，都告诉我。", "你要是也在用 AI 做自己的东西，也来聊聊，我们互相看看。", "让每一个瞬间，自有光彩。"],
  "long-en": ["I shot some footage I really loved.", "I got home, opened my Mac, and wanted to do one simple thing: make the colours look right.", "And then I ran into something strange.", "DJI's editing app, Mimo, only exists on phones.", "So to grade on a big screen, I'd have to send everything back to my phone and nudge sliders on a tiny screen.", "Fine — use the pro tools, then.", "Lightroom and Photoshop can do anything.", "But the first time you open them, you're staring at dozens of sliders.", "Exposure, highlights, shadows, whites, blacks, dehaze…", "I didn't know which one to touch first, or whether I'd just made it better or worse.", "【Your honest feeling, in one line — e.g. \"I just wanted a nice photo. I didn't want to take a course first.\"】", "So I wondered: could there be a tool that's as simple as a phone app, but on the Mac —", "and that, when you're curious, actually explains why?", "The very first prototype was written by ChatGPT. It ran, but it was slow and messy.", "Then I took it into Claude Code, and the first job wasn't adding features. It was finding problems — and measuring every one of them on my Mac.", "Adding a folder with two thousand files used to take almost seven seconds and freeze the whole window. Now it's under a hundredth of a second.", "DJI's own LUTs for the Pocket 3 wouldn't even import, because of how their titles were encoded. Now they just work.", "The part that surprised me most:", "almost every change started with one plain sentence from me.", "\"This blue is too bright.\"", "\"The right side feels loose.\"", "\"There isn't enough information here.\"", "\"Too many boxes.\"", "I'd say it, the AI would try something, I'd look, and say the next thing. Round after round.", "And yes — the AI gets things wrong, and it can sound very sure of itself.", "It once looked at a latte on a white table and told me the photo was \"too bright\", and suggested pulling the exposure down by a stop and a half.", "But a white table is supposed to be bright.", "You only catch that kind of mistake by actually using the thing. So we fixed it, and added a test so it can't come back.", "【One line on what working with AI felt like for you — e.g. \"It's fast, but deciding what looks right is still my job.\"】", "So what can it actually do? Let me just show you.", "Drag in a folder, or a few photos.", "Press Auto. It reads this particular photo first, then fixes the light and colour.", "It's restrained on purpose: a bright white scene stays bright, a night shot stays a night shot, a sunset keeps its warmth. Don't like it? Undo, and you're back.", "If you want to adjust it yourself, there are just six sliders by default: brightness, contrast, highlights, shadows, warmth, and vibrance. Each one comes with a plain sentence about what it does.", "Presets aren't a list of mysterious names — each one is a little preview made from your photo. Pick the one you like.", "Cropping? Just drag on the photo.", "When you're done, it saves straight into Photos on your Mac. With iCloud Photos on, it's on your iPhone a moment later.", "And video clips under three seconds can become real Live Photos.", "Over the last few weeks it has grown quite a bit.", "Only want to change part of a photo? Drag a gradient and the sky gets darker while the ground doesn't move at all. Or use an ellipse, or a brush, and it can even find the main subject for you.", "A wire, a passer-by, litter on the ground: paint over it with Remove, and it fills the spot in from its surroundings. It all runs on your Mac, no internet needed.", "Like another photo's colors? Use Match Colors, and this photo moves toward it, as far as you drag the slider.", "Photos from one trip, one post or one client shoot can live in a single project: change the color on any one of them and the whole project follows, while exposure and crop stay with each photo.", "And two features built on small AI models: AI Look makes a grade just for this photo, and AI HDR gives an ordinary photo real highlights on an HDR screen. The models ship inside the app and run on your Mac, so nothing is uploaded.", "Live Photos are editable too: the photo and the motion are graded together, it exports as a Live Photo again, and the time it was taken is still there.", "But the thing I care about most is something else.", "A one-tap filter can make a photo look better — and next time, you still don't know why.", "There's a photography creator on Douyin, Zhang Xiaoyang, who explains histograms, curves and aperture with animation, more clearly than any manual I've read.", "But he's only made a handful of videos. They can't cover all the basics.", "So we brought that way of teaching into the app — using your own photos.", "Watch your picture break into pixels and pile up by brightness into a little mountain: that's a histogram.", "There are thirteen lessons now — histograms, exposure, curves, white balance, aperture, focal length, even frame rate and Log footage for video.", "Many of them are in 3D, and you can drag to turn them: your photo's brightness becomes a little mountain range, and its colors become a cloud of points inside a cube.", "Every word and every animation is our own, and we're still adding lessons one at a time.", "What each lesson teaches is a chapter of its own, coming up next.", "It's called Lucet.", "Lūcet is Latin for \"it shines\".", "Its Chinese name, 光集, means \"gathering light\".", "Because a photo is just that: light you decided to keep.", "A few honest things before you go.", "It's an early version. It runs on Apple-silicon Macs with macOS 15 or later. It isn't notarized by Apple yet, so the first time you open it, you'll need to allow it once in System Settings. Common RAW files open, but they're treated as ordinary images, not developed as RAW.", "It never changes your originals. There's no account, and none of your photos are uploaded anywhere. The interface comes in English and Chinese.", "If you've got a folder of photos you can't bring yourself to delete, but don't know how to fix — come and try it.", "Tell me where it's confusing, or where it gets in your way.", "And if you're building your own thing with AI, tell me about it. I'd love to see what you're making.", "Let your moments shine."],
  "learn-zh": ["一键滤镜，能让一张照片变好看。", "可是下一次，你还是不知道，为什么。", "抖音上有一位摄影博主，张小样，他用动画讲直方图、讲曲线、讲光圈，比任何说明书都清楚。", "可惜，他只有几条视频，讲不完所有的基础。", "所以，我们把这种讲法，放进了 App 里。", "而且，用的是你自己的照片。", "每一课只要几分钟：先看动画，再自己拖一拖，最后有一个小问题。", "【这里说一句你自己：你学摄影的时候，卡在哪个词上？比如：「我第一次听说直方图，是在一个教程里，一句话就带过去了。」】", "先从一个问题开始：调色软件里，那座「小山」，到底是什么？", "答案是，一张照片，碎成一个个小格子。", "去掉颜色，只剩明暗；再把明暗变成高度，照片就成了一片立体的柱子，你可以用手拖着转。", "然后把所有的格子，按亮度排好队，一样亮的，叠在同一列。叠出来的形状，就是直方图。", "接着是：「提亮暗部」里的暗部，到底是哪一部分？", "把亮度分成五段，从最暗部，到最亮部。点哪一段，照片上就只保留属于它的地方。", "还有一课，专门讲：为什么有些天空，怎么调都是一片白。", "因为纯白的地方，相机根本没有记录到那里的差别，后期是找不回来的。", "都是变亮，为什么有时候，天空先「爆」掉了？", "因为曝光，像是多进了一倍的光：越亮的地方，增加得越多。而亮度，更像是整体往上挪一点。", "高光、阴影、白色、黑色，有什么区别？", "选一个滑块拖一拖：照片上亮起来的，就是它改变的地方；直方图上的阴影，就是它管的那一段亮度。", "曲线，看起来很专业，其实只回答一个问题：原来多亮，现在多亮。", "横着是原来，竖着是现在。往上拉，就是变亮；S 形，是暗的更暗，亮的更亮，对比就变强了。所以照片发灰的时候，最常用的就是 S 形。", "为什么在室内拍的照片，总是发黄？", "因为光本身，是有颜色的。烛光和灯泡偏橙，正午的阳光接近白，阴天和树荫偏蓝。", "课里让你在照片上，点一个本来就该是白色或灰色的地方，光集就把它校正成中性灰，整张照片的偏色，也跟着消失了。", "你还能看到，照片的像素，在一个 RGB 立方体里，是怎样偏离灰色的那根轴的。", "再问一个：怎样只让天空更蓝，而草地不变？", "答案是 HSL。任何一种颜色，都能用三个数找到：绕着圈的是色相，向外是饱和度，向上是明亮度。选中蓝色，只把蓝色的明亮度往下压，天空变深，草地不动。", "这些课，不只教你修，也教你拍。", "为什么 ƒ/4，比 ƒ/2.8 的光圈小？", "因为 ƒ 后面，是一个除数：开口的直径，等于焦距，除以 ƒ 值。ƒ 值越大，开口越小，进来的光越少。", "想拍背景虚化的照片，就要开大光圈：这时候，空间里只有很薄的一层是清楚的，前面和后面的东西，就虚了。", "同样亮的照片，为什么有的糊，有的满是噪点？", "课里把时间想成纵深：快门开着的那段时间，是一块玻璃板，板越厚，进来的光越多，球在板里走过的路，也越长，这就是拖影。", "ISO 呢，是把每一格收到的光，统统放大；可光是一颗一颗随机落下来的，放得越大，噪点就越明显。", "光圈、快门、ISO，三个旋钮，同一个亮度，每一个都有它的代价：景深、拖影、噪点。", "还有，同一个位置，为什么手机的「2 倍」「5 倍」，拍出来差这么多？", "因为焦距越长，相机看到的是一个越窄的楔形，同一座山，占的画面比例就越大，背景显得又大又近。", "拍视频的人，还有两课。", "为什么视频的快门，不能像拍照那样越快越好？", "因为每一帧，都要有一点拖影。常用的做法是：快门大约等于一除以两倍的帧率。用 25 帧拍，就是五十分之一秒。太快了，每一帧都清清楚楚，连起来反而一跳一跳。", "还有，D-Log 拍出来，为什么灰蒙蒙的？", "因为 Log，把更多的亮度，装进了同一个文件，代价就是又灰又淡。所以拿到素材，第一步，是先套用这台相机对应的转换 LUT，再去调。", "现在一共有十三课，从直方图、曝光、曲线，到白平衡、光圈、焦距，还有视频的帧率和 Log。", "很多课里的画面，是 3D 的，可以用手拖着转。", "你可以选初级、中级、高级，讲解的深浅，会跟着变。", "学过什么，只记在你的 Mac 上。", "它还会读你的这张照片，指出哪里亮过头了，哪里偏色，再给你一个，点一下就能试的调整。", "而且，它从来不催你学。想知道一个滑块是做什么的，在它上面点右键，或者把鼠标放在区块的标题上，点那个小小的播放键，课就在眼前；学完，回到你的照片，刚才那几个滑块会轻轻亮一下。", "不想学，它一句也不会打扰你，还能整个关掉。", "文字和动画，都是我们自己写、自己画的，而且还在一课一课地往上加。"],
  "learn-en": ["A one-tap filter can make a photo look better.", "But next time, you still don't know why.", "There's a photography creator on Douyin, Zhang Xiaoyang, who explains histograms, curves and aperture with animation, more clearly than any manual I've read.", "But he's only made a handful of videos. They can't cover all the basics.", "So we brought that way of teaching into the app.", "And we do it with your own photo.", "Each lesson takes a few minutes: watch the animation, drag something yourself, and answer one small question.", "【One line of your own: where did you get stuck when you were learning photography? e.g. \"The first time I heard the word histogram, it was one sentence in a tutorial, and then it moved on.\"】", "Let's start with a question: in every editing app, what is that little mountain?", "The answer starts with a photo, broken into small cells.", "Take away the color and you're left with brightness. Turn the brightness into height, and the photo becomes a field of columns that you can drag to turn.", "Then line all the cells up by brightness, with equally bright ones stacked in the same column. The shape that builds up is the histogram.", "Next: when an editor says \"lift the shadows\", which part of the photo is that?", "The lesson splits brightness into five zones, from the darkest to the brightest. Click one, and only the part of the photo that belongs to it stays.", "And one lesson is about why some skies stay white however you edit them.", "Because in a pure white area the camera never recorded any difference, and editing can't bring it back.", "Both make a photo brighter, so why does the sky sometimes blow out first?", "Because exposure is like letting in twice the light: the brighter the spot, the more it gains. Brightness is more like nudging everything up a little.", "Highlights, shadows, whites, blacks: what's the difference?", "Drag one slider and the photo lights up where that slider works; the shaded part of the histogram is the range of brightness it controls.", "Curves look very professional, but they only answer one question: how bright was it, and how bright is it now?", "Across is before, up is after. Pull up and it's brighter. An S-shape makes darks darker and lights lighter, so contrast goes up. That's why an S-curve is the usual fix for a gray, flat photo.", "Why do photos taken indoors always look yellow?", "Because light itself has a color. Candles and bulbs lean orange, noon sun is close to white, overcast and shade lean blue.", "In the lesson, you click a spot in the photo that should be white or gray, and Lucet corrects it to neutral gray, and the color cast across the whole photo goes with it.", "You can also see the photo's pixels in an RGB cube, and how they drift away from the gray axis.", "One more: how do you make only the sky bluer while the grass stays the same?", "The answer is HSL. Any color can be found with three numbers: around the circle is hue, outward is saturation, upward is brightness. Pick blue, pull down only the blue's brightness, and the sky gets deeper while the grass doesn't move.", "These lessons don't only teach you to edit. They teach you to shoot.", "Why is f/4 a smaller opening than f/2.8?", "Because the number after the f is a divisor: the diameter of the opening equals the focal length divided by the f-number. The bigger the number, the smaller the opening and the less light gets in.", "Want a blurry background? Open the aperture wide. Then only a very thin slice of space is sharp, and what's in front and behind it goes soft.", "Two photos, equally bright. Why is one blurry and the other full of noise?", "The lesson treats time as depth. The time the shutter is open is a slab of glass. The thicker the slab, the more light gets in, and the longer the path a moving ball travels inside it, and that's motion blur.", "ISO multiplies whatever each cell collected. But light lands one particle at a time, at random, so the more you multiply, the more the noise shows.", "Aperture, shutter and ISO are three knobs for the same brightness, and each has its price: depth of field, blur, noise.", "And one more: from the same spot, why do a phone's \"2×\" and \"5×\" look so different?", "Because the longer the focal length, the narrower the wedge the camera sees. The same mountain fills more of the frame, and the background looks bigger and closer.", "If you shoot video, there are two more lessons.", "Why can't a video's shutter simply be as fast as possible, the way it is for photos?", "Because every frame needs a little blur. The usual rule: shutter is about one over twice the frame rate. Shooting 25 frames a second, that's 1/50. Faster, and every frame is crisp, but played together it stutters.", "And why does D-Log footage look so flat and gray?", "Because Log packs more brightness into the same file, and the price is that it looks gray and washed out. So when you get the footage, the first step is to apply the conversion LUT for that camera, and only then start grading.", "There are thirteen lessons now: histograms, exposure, curves, white balance, aperture, focal length, and for video, frame rate and Log.", "Many of them are in 3D, and you can drag to turn them.", "You can choose Beginner, Intermediate or Advanced, and the explanations change depth.", "What you've learned stays on your Mac.", "It also reads your photo and points out where it's too bright and where there's a color cast, with an adjustment you can try in one click.", "And it never nags. Want to know what a slider does? Right-click it, or hover over a section's title and click the small play button, and the lesson is right there. When it ends, you're back on your photo, and those sliders glow for a moment.", "If you'd rather not learn, it stays quiet, and you can switch it all off.", "Every word and every animation is our own, and we keep adding lessons one at a time."]};
const chosen = LONG[new URLSearchParams(location.search).get("v")] || LINES;
const box = document.getElementById("text");
chosen.forEach(t => { const p = document.createElement("p"); p.className = "line" + (t.startsWith("【") ? " slot" : ""); p.textContent = t; box.appendChild(p); });
const lines = [...box.children];
let y = 0, speed = 46, size = 56, playing = false, last = 0, counting = false;
const stage = document.getElementById("stage"), pos = document.getElementById("pos");
function apply() {
  document.documentElement.style.setProperty("--size", size + "px");
  const start = innerHeight * 0.30;                       // the first line begins at the eye marker
  box.style.top = start - y + "px";
  const mid = innerHeight * 0.30 + 40;
  lines.forEach(l => { const r = l.offsetTop + start - y; l.classList.toggle("now", r < mid + 30 && r + l.offsetHeight > mid - 30); });
  pos.textContent = `速度 ${speed}`;
}
function frame(ts) {
  if (playing) { y += speed * (ts - last) / 1000; const end = box.scrollHeight; if (y > end) { y = end; toggle(); } apply(); }
  last = ts; requestAnimationFrame(frame);
}
function toggle() {
  if (counting) return;
  if (playing) { playing = false; document.body.classList.remove("playing"); return; }
  counting = true; const c = document.getElementById("count"); c.style.display = "flex"; let n = 3; c.textContent = n;
  const tick = setInterval(() => { n--; if (n > 0) c.textContent = n; else { clearInterval(tick); c.style.display = "none"; counting = false; playing = true; document.body.classList.add("playing"); last = performance.now(); } }, 1000);
}
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowUp") { speed = Math.min(140, speed + 6); apply(); }
  else if (e.key === "ArrowDown") { speed = Math.max(12, speed - 6); apply(); }
  else if (e.key === "+" || e.key === "=") { size = Math.min(96, size + 4); apply(); }
  else if (e.key === "-") { size = Math.max(32, size - 4); apply(); }
  else if (e.key === "m" || e.key === "M") document.body.classList.toggle("mirror");
  else if (e.key === "r" || e.key === "R") { y = 0; playing = false; document.body.classList.remove("playing"); apply(); }
});
addEventListener("resize", apply); apply(); requestAnimationFrame(frame);
</script>
</body>
</html>
